<!-- workbench/events.html -->
<!-- ============================= -->
<div class="tab-pane fade" id="events" role="tabpanel" aria-labelledby="events-tab">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 data-i18n="events.title">Rule Events</h4>
    </div>


    <div class="card mb-3 bg-secondary bg-opacity-10 border-secondary">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label data-i18n="events.form.rule" class="form-label small">Rule</label>
                    <select id="eventRuleSelect" class="form-select form-select-sm"></select>
                </div>
                <div class="col-md-2">
                    <label data-i18n="events.form.startDate" class="form-label small">Start Date</label>
                    <input type="date" class="form-control form-control-sm" id="eventStart">
                </div>
                <div class="col-md-2">
                    <label data-i18n="events.form.endDate" class="form-label small">End Date</label>
                    <input type="date" class="form-control form-control-sm" id="eventEnd">
                </div>
                <div class="col-md-2">
                    <label data-i18n="events.form.provider" class="form-label small">Provider</label>
                    <select id="eventProvider" class="form-select form-select-sm">
                        <option value="swisseph" data-i18n="events.providerOptions.swisseph">Swiss Ephemeris</option>
                        <option value="skyfield" data-i18n="events.providerOptions.skyfield">Skyfield Ephemeris</option>
                    </select>
                </div>
                <div class="col-md-1 text-center">
                    <div class="form-check">
                        <input id="eventOverwrite" class="form-check-input" type="checkbox">
                        <label data-i18n="events.form.overwrite" class="form-check-label small">Overwrite</label>
                    </div>
                </div>
                <div class="col-md-2 text-end">
                    <button data-i18n="events.form.generate" id="btnGenerateEvents" class="btn btn-sm btn-light">Generate Events</button>
                </div>
            </div>
        </div>
    </div>

    <div id="eventResults" class="mt-3">
        <div data-i18n="events.placeholder" class="text-muted">Select a rule to view events.</div>
    </div>
</div>
<!-- ============================= -->
