<!-- Astro Configuration Modal -->
<div class="modal fade" id="astroConfigModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Astro Configuration</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="astroConfigForm" class="row g-2">
          <div class="col-md-6">
            <label class="form-label small">Longitude (°E)</label>
            <input type="number" step="0.0001" id="astroLon" class="form-control form-control-sm" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small">Latitude (°N)</label>
            <input type="number" step="0.0001" id="astroLat" class="form-control form-control-sm" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small">Altitude (m)</label>
            <input type="number" step="1" id="astroAlt" class="form-control form-control-sm">
          </div>
          <div class="col-md-6">
            <label class="form-label small">Timezone</label>
            <input type="text" id="astroTz" class="form-control form-control-sm" list="tzList">
            <datalist id="tzList">
              <option>UTC</option>
              <option>Asia/Kolkata</option>
              <option>America/New_York</option>
              <option>Europe/London</option>
              <option>Asia/Tokyo</option>
            </datalist>
          </div>
          <div class="col-12">
            <label class="form-label small">Ayanamsa Mode (use top-right to change)</label>
            <div id="astroAyanamsaModalLabel" class="form-control form-control-sm bg-dark text-light"
              style="border:1px solid #6c757d;">
              --
            </div>
          </div>
          <div class="col-12 mt-2">
            <p class="small text-secondary mb-1">
              <i class="bi bi-info-circle"></i>
              You can use the “Auto Detect” button below to fill in your current
              browser location and timezone. This uses your device’s GPS or IP-based location.
            </p>
            <button type="button" id="astroAutoDetect" class="btn btn-outline-info btn-sm w-100">
              📍 Auto Detect My Location
            </button>
          </div>
        </form>
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="astroConfigReset" class="btn btn-outline-warning btn-sm">Reset to Defaults</button>
        <button type="button" id="astroConfigSave" class="btn btn-primary btn-sm">Save Changes</button>
      </div>
    </div>
  </div>
</div>
<!-- ============================= -->
