{% include 'workbench/sector_modal.html' %}

<!-- Astro Configuration Modal -->
<div class="modal fade" id="astroConfigModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 data-i18n="modal.astro.title" class="modal-title">Astro Configuration</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="astroConfigForm" class="row g-3">
          <div class="col-md-6">
            <label data-i18n="modal.astro.lon" class="form-label small">Longitude (°E)</label>
            <input type="number" step="0.0001" id="astroLon" class="form-control form-control-sm" required>
          </div>
          <div class="col-md-6">
            <label data-i18n="modal.astro.lat" class="form-label small">Latitude (°N)</label>
            <input type="number" step="0.0001" id="astroLat" class="form-control form-control-sm" required>
          </div>
          <div class="col-md-6">
            <label data-i18n="modal.astro.alt" class="form-label small">Altitude (m)</label>
            <input type="number" step="1" id="astroAlt" class="form-control form-control-sm">
          </div>
          <div class="col-md-6">
            <label data-i18n="modal.astro.tz" class="form-label small">Timezone</label>
            <input type="text" id="astroTz" class="form-control form-control-sm" list="tzList">
            <datalist id="tzList">
              <option>UTC</option>
              <option>Asia/Kolkata</option>
              <option>America/New_York</option>
              <option>Europe/London</option>
              <option>Asia/Tokyo</option>
            </datalist>
          </div>
          <div class="col-12">
            <label data-i18n="modal.astro.ayanamsaHint" class="form-label small">
              Ayanamsa Mode (use top-right to change)
            </label>
            <div id="astroAyanamsaModalLabel"
              class="form-control form-control-sm bg-dark text-light border border-secondary">
              --
            </div>
            <!-- Default Reference Time -->
            <div class="mb-2">
              <label data-i18n="modal.astro.defaultRefTime" class="form-label small" for="astroDefaultRefTime">
                Default Reference Time (HH:MM:SS)
              </label>
              <input type="time" step="1" id="astroDefaultRefTime"
                class="form-control form-control-sm bg-dark text-light border-secondary" value="00:00:00" />
              <small data-i18n="modal.astro.defaultRefTimeHint" class="text-secondary">
                This time is used as the default reference for ephemeris calculations.
              </small>
            </div>


            <!-- Ephemeris Provider -->
            <div class="mb-2">
              <label data-i18n="modal.astro.provider" for="astroProvider" class="form-label small">
                Ephemeris Provider
              </label>
              <select id="astroProvider" class="form-select form-select-sm">
                <option value="skyfield" data-i18n="nav.providerOptions.skyfield">Skyfield Ephemeris</option>
                <option value="swisseph" data-i18n="nav.providerOptions.swisseph">Swiss Ephemeris</option>
              </select>
            </div>

            <!-- Node Mode -->
            <div class="mb-2">
              <label data-i18n="modal.astro.nodeMode" for="astroNodeMode" class="form-label small">
                Node Mode (Mean/True)
              </label>
              <select id="astroNodeMode" class="form-select form-select-sm">
                <option value="mean">Mean Node</option>
                <option value="true">True Node</option>
              </select>
            </div>

            <!-- Max Workers -->
            <div class="mb-2">
              <label data-i18n="modal.astro.maxWorkers" for="astroWorkers" class="form-label small">
                Max Workers
              </label>
              <input type="number" min="1" max="8" id="astroWorkers" class="form-control form-control-sm" value="2" />
            </div>


          </div>

          <div class="col-12">
            <p data-i18n="modal.astro.info" class="small text-secondary mb-1">
              <i class="bi bi-info-circle"></i>
              You can use the “Auto Detect” button below to fill in your current browser location and timezone.
            </p>
            <button data-i18n="modal.astro.auto" type="button" id="astroAutoDetect"
              class="btn btn-outline-info btn-sm w-100">
              📍 Auto Detect My Location
            </button>
          </div>
        </form>

      </div>
      <div class="modal-footer border-secondary">
        <button type="button" data-i18n="modal.astro.cancel" class="btn btn-secondary btn-sm"
          data-bs-dismiss="modal">Cancel</button>
        <button type="button" data-i18n="modal.astro.reset" id="astroConfigReset"
          class="btn btn-outline-warning btn-sm">Reset to Defaults</button>
        <button type="button" data-i18n="modal.astro.save" id="astroConfigSave" class="btn btn-primary btn-sm">Save
          Changes</button>
      </div>
    </div>
  </div>
</div>
<!-- ============================= -->
