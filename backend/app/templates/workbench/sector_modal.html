<div class="modal fade" id="sectorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="sectorModalTitle" data-i18n="sectors.modal.title">Add Sector</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    data-i18n="sectors.modal.close" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="sectorForm" class="row g-2">
                    <input type="hidden" id="sector_id">
                    <div class="col-md-6">
                        <label data-i18n="sectors.modal.code" class="form-label small">Code</label>
                        <input id="sector_code" class="form-control form-control-sm" required>
                    </div>
                    <div class="col-md-6">
                        <label data-i18n="sectors.modal.name" class="form-label small">Name</label>
                        <input id="sector_name" class="form-control form-control-sm" required>
                    </div>
                    <div class="col-12">
                        <label data-i18n="sectors.modal.description" class="form-label small">Description</label>
                        <input id="sector_description" class="form-control form-control-sm">
                    </div>
                    <div class="col-12 text-end mt-2">
                        <button type="submit" data-i18n="sectors.modal.save" class="btn btn-sm btn-primary">Save
                            Sector</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
