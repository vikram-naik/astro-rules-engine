<div class="tab-pane fade" id="sectors" role="tabpanel" aria-labelledby="sectors-tab">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 data-i18n="sectors.title">Sectors</h4>
        <button id="btnAddSector" class="btn btn-sm btn-outline-light" data-i18n="sectors.add">+ Add Sector</button>
    </div>

    <div class="table-responsive">
        <table id="sectorsTable" class="table table-sm table-dark table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th data-i18n="sectors.col.code">Code</th>
                    <th data-i18n="sectors.col.name">Name</th>
                    <th data-i18n="sectors.col.description">Description</th>
                    <th data-i18n="sectors.col.actions" style="width:120px">Actions</th>
                </tr>
            </thead>
            <tbody id="sectorsBody"></tbody>
        </table>
    </div>

</div>
