<!-- workbench/rule_editor.html -->
<!-- ============================= -->
{% extends "base.html" %}
{% block body %}
<div class="container-fluid my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 id="ruleEditorTitle">Rule Authoring</h3>
    <a href="/ui/workbench" class="btn btn-outline-secondary btn-sm">← Back to Workbench</a>
  </div>

  <!-- RULE INFO -->
  <div class="card bg-secondary bg-opacity-10 border-secondary mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label small">Rule Name</label>
          <input id="rule_name" class="form-control form-control-sm" required>
        </div>
        <div class="col-md-5">
          <label class="form-label small">Description</label>
          <input id="rule_description" class="form-control form-control-sm">
        </div>
        <div class="col-md-2">
          <label class="form-label small">Confidence</label>
          <input id="rule_confidence" type="number" step="0.05" min="0" max="1"
                 class="form-control form-control-sm" value="0.8">
        </div>
        <div class="col-md-1 d-flex align-items-center justify-content-center">
          <div class="form-check mb-1">
            <input id="rule_enabled" class="form-check-input" type="checkbox" checked>
            <label class="form-check-label small">Enabled</label>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- CONDITIONS -->
  <div class="card bg-secondary bg-opacity-10 border-secondary mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Conditions</span>
      <button id="btnAddCondition" class="btn btn-sm btn-light">+ Add Condition</button>
    </div>
    <div class="card-body" id="conditionsContainer"></div>
  </div>

  <!-- OUTCOMES -->
  <div class="card bg-secondary bg-opacity-10 border-secondary mb-4">
    <div class="card-header">Outcome</div>
    <div class="card-body row g-3">
      <div class="col-md-4">
        <label class="form-label small">Sector</label>
        <select id="rule_sector" class="form-select form-select-sm"></select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">Effect</label>
        <select id="rule_effect" class="form-select form-select-sm"></select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">Weight</label>
        <input id="rule_weight" type="number" step="0.1" value="1.0" class="form-control form-control-sm">
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="text-end mt-3">
    <button id="btnSaveRule" class="btn btn-primary btn-sm">Save Rule</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/main.js"></script>
<script src="/static/sectors.js"></script>
<script src="/static/rule_editor.js"></script>
{% endblock %}
