<div id="rules">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 data-i18n="rules.title">Rules</h4>
        <button id="btnAddRule" data-i18n="rules.add" class="btn btn-sm btn-outline-light">+ Add Rule</button>
    </div>


    <div class="table-responsive">
        <table id="rulesTable" class="table table-sm table-dark table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th data-i18n="rules.col.name">Name</th>
                    <th data-i18n="rules.col.description">Description</th>
                    <th data-i18n="rules.col.confidence">Confidence</th>
                    <th data-i18n="rules.col.enabled">Enabled</th>
                    <th data-i18n="rules.col.actions" style="width:160px">Actions</th>
                </tr>
            </thead>
            <tbody id="rulesBody"></tbody>
        </table>
    </div>
</div>
